name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@7b35a31ae9844db8b177ef3ca869184a79d791f8  # main
    with:
      commit_sha: ${{ github.sha }}
      package: deep-rl-class
      package_name: deep-rl-course
      path_to_docs: deep-rl-class/units/
      additional_args: --not_python_module
      languages: en
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
